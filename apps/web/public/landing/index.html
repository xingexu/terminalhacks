<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Everwhere — Your life, worth keeping</title>
  <meta name="description" content="A private home for your photos, places, and stories. Collect a moment, tell its story, and come back to it with Everwhere.">
  <meta name="theme-color" content="#f7f7f2">
  <base href="/landing/">
  <link rel="preload" href="photos/lake.webp" as="image">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Everwhere home">Everwhere<span aria-hidden="true">.</span></a>
    <a class="intro-link" href="/app?tour=1">How it works <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <section class="welcome" aria-labelledby="title">
      <div class="welcome-copy">
        <h1 id="title">Your life.<br>A little closer.</h1>
        <p>A private home for the photos, places, and stories you want to come back to.</p>
        <a class="open-button" href="/app">Open Everwhere <span aria-hidden="true">→</span></a>
      </div>
      <div class="memory-collection" aria-label="Photographs of places to remember">
        <figure class="photo photo-ocean"><img src="photos/ocean.webp" alt="Waves meeting a quiet coastline" width="420" height="560"></figure>
        <figure class="photo photo-lake"><img src="photos/lake.webp" alt="A mountain reflected in a still alpine lake" width="600" height="740" fetchpriority="high"></figure>
        <figure class="photo photo-desert"><img src="photos/desert.webp" alt="Sandstone formations in the desert" width="420" height="510"></figure>
      </div>
    </section>
    <section class="collection-details" aria-label="What you can keep">
      <p>Photos &amp; films</p><p>Places &amp; timelines</p><p>Stories in your own words</p>
    </section>
  </main>
  <footer><span>Made for your memories.</span><a href="https://github.com/xingexu/terminalhacks" target="_blank" rel="noreferrer">View on GitHub</a></footer>
</body>
</html>
