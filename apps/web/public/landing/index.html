<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Everwhere — Some moments deserve forever</title>
  <meta name="description" content="Keep your photos, places, and stories together. Revisit a memory, tell its story, and make a film with Everwhere.">
  <meta name="theme-color" content="#101318">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Cpath d='M16 6v20M6 16h20M9 9l14 14M23 9 9 23' stroke='%23f3f2ee' stroke-width='2.4'/%3E%3C/svg%3E">
  <base href="/landing/">
  <link rel="preload" href="fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="studio.css">
  <script src="ascii-background.js" defer></script>
</head>
<body>
  <div class="ascii-background" aria-hidden="true">
    <canvas class="ascii-photo"></canvas>
    <canvas class="ascii-trail"></canvas>
  </div>
  <main class="preview" aria-labelledby="title">
    <div>
      <div class="wordmark">
        <div class="wordmark-object">
          <div class="wordmark-layers" aria-hidden="true">
            <span class="wordmark-layer wordmark-layer--far" data-text="Everwhere"></span>
            <span class="wordmark-layer wordmark-layer--middle" data-text="Everwhere"></span>
            <span class="wordmark-layer wordmark-layer--near" data-text="Everwhere"></span>
          </div>
          <h1 id="title">Everwhere</h1>
        </div>
      </div>
      <p>Some moments deserve forever.</p>
      <a class="try-link" href="/app">Try it out</a>
    </div>
  </main>
</body>
</html>
